          import androidx.navigation.compose.*

          enum class Ecran(val route: String, val titre: String, val icone: ImageVector) {
              Accueil("accueil", "Accueil", Icons.Filled.Shield),
              Serveurs("serveurs", "Serveurs", Icons.Filled.Dns),
              Importation("importation", "Import", Icons.Filled.FileUpload),
              Historique("historique", "Historique", Icons.Filled.History),
              Parametres("parametres", "Réglages", Icons.Filled.Settings),
              ConfigPerso("config", "Configuration personnalisée", Icons.Filled.Tune),
              Abonnement("abonnement", "Abonnement", Icons.Filled.Star),
              APropos("apropos", "À propos", Icons.Filled.Info)
          }

          private val barreBasse = listOf(
              Ecran.Accueil, Ecran.Serveurs, Ecran.Importation, Ecran.Historique, Ecran.Parametres
          )

          @Composable
          fun LordVpnApp(nav: NavHostController) {
              val entree by nav.currentBackStackEntryAsState()
              val routeActuelle = entree?.destination?.route

              Scaffold(
                  containerColor = MaterialTheme.colorScheme.background,
                  bottomBar = {
                      NavigationBar(containerColor = MaterialTheme.colorScheme.surface) {
                          barreBasse.forEach { ecran ->
                              NavigationBarItem(
                                  selected = routeActuelle == ecran.route,
                                  onClick = {
                                      nav.navigate(ecran.route) {
                                          popUpTo(Ecran.Accueil.route)
                                          launchSingleTop = true
                                      }
                                  },
                                  icon = { Icon(ecran.icone, contentDescription = ecran.titre) },
                                  label = { Text(ecran.titre, maxLines = 1) },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = MaterialTheme.colorScheme.onPrimary,
                                      indicatorColor = MaterialTheme.colorScheme.primary
                                  )
                              )
                          }
                      }
                  }
              ) { marges ->
                  NavHost(
                      navController = nav,
                      startDestination = Ecran.Accueil.route,
                      modifier = Modifier.padding(marges)
                  ) {
                      composable(Ecran.Accueil.route) { EcranAccueil() }
                      composable(Ecran.Serveurs.route) { EcranServeurs() }
                      composable(Ecran.Importation.route) { EcranImportation() }
                      composable(Ecran.Historique.route) { EcranTemporaire("Historique des connexions") }
                      composable(Ecran.Parametres.route) { EcranParametres(nav) }
                      composable(Ecran.ConfigPerso.route) { EcranTemporaire("Configuration personnalisée") }
                      composable(Ecran.Abonnement.route) { EcranTemporaire("Abonnement") }
                      composable(Ecran.APropos.route) { EcranTemporaire("À propos de LORD VPN") }
                  }
              }
          }

          @Composable
          fun EcranTemporaire(titre: String) {
              Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                  Text(titre, style = MaterialTheme.typography.headlineSmall)
              }
          }

          @Composable
          fun EcranParametres(nav: NavHostController) {
              Column(
                  Modifier.fillMaxSize().padding(24.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text("Paramètres", style = MaterialTheme.typography.headlineSmall)
                  listOf(Ecran.ConfigPerso, Ecran.Abonnement, Ecran.APropos).forEach { e ->
                      Button(onClick = { nav.navigate(e.route) }, modifier = Modifier.fillMaxWidth()) {
                          Text(e.titre)
                      }
                  }
              }
          }
