                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/java/com/lordvpn/MainActivity.kt')"
          cat > 'app/src/main/java/com/lordvpn/MainActivity.kt' <<'LORDEOF'
          package com.lordvpn

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.navigation.compose.rememberNavController
          import com.lordvpn.data.DepotServeurs
          import com.lordvpn.ui.LordVpnApp
          import com.lordvpn.ui.theme.LordVpnTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  DepotServeurs.init(applicationContext)
                  enableEdgeToEdge()
                  setContent {
                      LordVpnTheme {
