name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer le projet LORD VPN
        run: |
          mkdir -p proj
          cd proj
          mkdir -p "$(dirname '.gitignore')"
          cat > '.gitignore' <<'LORDEOF'
          *.iml
          .gradle/
          local.properties
          .idea/
          build/
          captures/
          .DS_Store
          *.jks
          *.keystore
          LORDEOF
          mkdir -p "$(dirname 'README.md')"
          cat > 'README.md' <<'LORDEOF'
          # LORD VPN (Android)

          Application VPN Android en Kotlin + Jetpack Compose.

          ## État actuel (étapes 1 et 2)
          - Gestion des serveurs : ajout, modification, suppression, sélection, ping TCP réel
          - Import (fichier, presse-papiers), export et partage des configurations
          - Stockage chiffré (Android Keystore)
          - Thème noir / bleu nuit / bleu électrique
          - Navigation (8 pages) et écran d accueil
          - Compilation automatique de l APK via GitHub Actions

          Le moteur VPN (Xray, SSH, SlowDNS), la gestion des serveurs et le backend
          seront ajoutés dans les étapes suivantes.

          ## Obtenir l APK
          Onglet Actions > dernier run > section Artifacts > LORD-VPN-debug-apk.
          LORDEOF
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'LORDEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.lordvpn"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.lordvpn"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              implementation("androidx.security:security-crypto:1.1.0-alpha06")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          LORDEOF
          mkdir -p "$(dirname 'app/proguard-rules.pro')"
          cat > 'app/proguard-rules.pro' <<'LORDEOF'

          LORDEOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'LORDEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
