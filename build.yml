name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Générer le projet LORD VPN
        run: |
          mkdir -p proj
          cd proj
          mkdir -p "$(dirname '.gitignore')"
          cat > '.gitignore' <<'LORDEOF'
          *.iml
          .gradle/
          local.properties
          .idea/
          build/
          captures/
          .DS_Store
          *.jks
          *.keystore
          LORDEOF
          mkdir -p "$(dirname 'README.md')"
          cat > 'README.md' <<'LORDEOF'
          # LORD VPN (Android)

          Application VPN Android en Kotlin + Jetpack Compose.

          ## État actuel (étape 1)
          - Thème noir / bleu nuit / bleu électrique
          - Navigation (8 pages) et écran d accueil
          - Compilation automatique de l APK via GitHub Actions

          Le moteur VPN (Xray, SSH, SlowDNS), la gestion des serveurs et le backend
          seront ajoutés dans les étapes suivantes.

          ## Obtenir l APK
          Onglet Actions > dernier run > section Artifacts > LORD-VPN-debug-apk.
          LORDEOF
          mkdir -p "$(dirname 'app/build.gradle.kts')"
          cat > 'app/build.gradle.kts' <<'LORDEOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.lordvpn"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.lordvpn"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "0.1.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = false
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")
                  }
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
              buildFeatures { compose = true }
              composeOptions { kotlinCompilerExtensionVersion = "1.5.14" }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.navigation:navigation-compose:2.7.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.2")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          LORDEOF
          mkdir -p "$(dirname 'app/proguard-rules.pro')"
          cat > 'app/proguard-rules.pro' <<'LORDEOF'

          LORDEOF
          mkdir -p "$(dirname 'app/src/main/AndroidManifest.xml')"
          cat > 'app/src/main/AndroidManifest.xml' <<'LORDEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />

              <application
                  android:allowBackup="false"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.LordVpn">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:theme="@style/Theme.LordVpn">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/java/com/lordvpn/MainActivity.kt')"
          cat > 'app/src/main/java/com/lordvpn/MainActivity.kt' <<'LORDEOF'
          package com.lordvpn

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import androidx.navigation.compose.rememberNavController
          import com.lordvpn.ui.LordVpnApp
          import com.lordvpn.ui.theme.LordVpnTheme

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent {
                      LordVpnTheme {
                          LordVpnApp(rememberNavController())
                      }
                  }
              }
          }
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/java/com/lordvpn/ui/EcranAccueil.kt')"
          cat > 'app/src/main/java/com/lordvpn/ui/EcranAccueil.kt' <<'LORDEOF'
          package com.lordvpn.ui

          import androidx.compose.foundation.BorderStroke
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.CircleShape
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.PowerSettingsNew
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.lifecycle.compose.collectAsStateWithLifecycle
          import com.lordvpn.ui.theme.*
          import com.lordvpn.vpn.Statut
          import com.lordvpn.vpn.VpnState

          @Composable
          fun EcranAccueil() {
              val statut by VpnState.statut.collectAsStateWithLifecycle()
              val serveur by VpnState.serveur.collectAsStateWithLifecycle()
              var info by remember { mutableStateOf<String?>(null) }

              val couleur = when (statut) {
                  Statut.CONNECTE -> Vert
                  Statut.CONNEXION -> Orange
                  Statut.DECONNECTE -> Rouge
              }
              val libelle = when (statut) {
                  Statut.CONNECTE -> "Connecté"
                  Statut.CONNEXION -> "Connexion en cours…"
                  Statut.DECONNECTE -> "Déconnecté"
              }

              Column(
                  Modifier.fillMaxSize().padding(24.dp),
                  horizontalAlignment = Alignment.CenterHorizontally,
                  verticalArrangement = Arrangement.spacedBy(20.dp)
              ) {
                  Spacer(Modifier.height(24.dp))
                  Text("LORD VPN", fontSize = 26.sp, fontWeight = FontWeight.Bold, color = BleuElectrique)

                  Spacer(Modifier.height(16.dp))
                  Surface(
                      onClick = {
                          if (serveur == null) {
                              info = "Aucun serveur configuré. Ajoutez-en un dans l onglet Serveurs."
                          }
                      },
                      shape = CircleShape,
                      color = BleuNuit,
                      border = BorderStroke(4.dp, couleur),
                      modifier = Modifier.size(180.dp)
                  ) {
                      Box(contentAlignment = Alignment.Center) {
                          Icon(
                              Icons.Filled.PowerSettingsNew, contentDescription = "Connecter",
                              tint = couleur, modifier = Modifier.size(80.dp)
                          )
                      }
                  }
                  Text(
                      if (statut == Statut.DECONNECTE) "CONNECT" else "DISCONNECT",
                      fontWeight = FontWeight.Bold, letterSpacing = 2.sp
                  )
                  Text(libelle, color = couleur, fontSize = 18.sp, fontWeight = FontWeight.SemiBold)
                  info?.let {
                      Text(it, color = TexteSecondaire, textAlign = TextAlign.Center, fontSize = 13.sp)
                  }

                  Card(
                      colors = CardDefaults.cardColors(containerColor = BleuNuit),
                      shape = RoundedCornerShape(16.dp),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Column(Modifier.padding(16.dp), verticalArrangement = Arrangement.spacedBy(10.dp)) {
                          Ligne("Serveur", serveur ?: "Aucun")
                          Ligne("Temps de connexion", "—")
                          Ligne("Téléchargement", "—")
                          Ligne("Envoi", "—")
                          Ligne("Données consommées", "—")
                          Ligne("Adresse IP publique", "—")
                      }
                  }
              }
          }

          @Composable
          private fun Ligne(nom: String, valeur: String) {
              Row(Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.SpaceBetween) {
                  Text(nom, color = TexteSecondaire)
                  Text(valeur, fontWeight = FontWeight.Medium)
              }
          }
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/java/com/lordvpn/ui/Navigation.kt')"
          cat > 'app/src/main/java/com/lordvpn/ui/Navigation.kt' <<'LORDEOF'
          package com.lordvpn.ui

          import androidx.compose.foundation.layout.*
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.*
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.runtime.getValue
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.vector.ImageVector
          import androidx.compose.ui.unit.dp
          import androidx.navigation.NavHostController
          import androidx.navigation.compose.*

          enum class Ecran(val route: String, val titre: String, val icone: ImageVector) {
              Accueil("accueil", "Accueil", Icons.Filled.Shield),
              Serveurs("serveurs", "Serveurs", Icons.Filled.Dns),
              Importation("importation", "Import", Icons.Filled.FileUpload),
              Historique("historique", "Historique", Icons.Filled.History),
              Parametres("parametres", "Réglages", Icons.Filled.Settings),
              ConfigPerso("config", "Configuration personnalisée", Icons.Filled.Tune),
              Abonnement("abonnement", "Abonnement", Icons.Filled.Star),
              APropos("apropos", "À propos", Icons.Filled.Info)
          }

          private val barreBasse = listOf(
              Ecran.Accueil, Ecran.Serveurs, Ecran.Importation, Ecran.Historique, Ecran.Parametres
          )

          @Composable
          fun LordVpnApp(nav: NavHostController) {
              val entree by nav.currentBackStackEntryAsState()
              val routeActuelle = entree?.destination?.route

              Scaffold(
                  containerColor = MaterialTheme.colorScheme.background,
                  bottomBar = {
                      NavigationBar(containerColor = MaterialTheme.colorScheme.surface) {
                          barreBasse.forEach { ecran ->
                              NavigationBarItem(
                                  selected = routeActuelle == ecran.route,
                                  onClick = {
                                      nav.navigate(ecran.route) {
                                          popUpTo(Ecran.Accueil.route)
                                          launchSingleTop = true
                                      }
                                  },
                                  icon = { Icon(ecran.icone, contentDescription = ecran.titre) },
                                  label = { Text(ecran.titre, maxLines = 1) },
                                  colors = NavigationBarItemDefaults.colors(
                                      selectedIconColor = MaterialTheme.colorScheme.onPrimary,
                                      indicatorColor = MaterialTheme.colorScheme.primary
                                  )
                              )
                          }
                      }
                  }
              ) { marges ->
                  NavHost(
                      navController = nav,
                      startDestination = Ecran.Accueil.route,
                      modifier = Modifier.padding(marges)
                  ) {
                      composable(Ecran.Accueil.route) { EcranAccueil() }
                      composable(Ecran.Serveurs.route) { EcranTemporaire("Liste des serveurs") }
                      composable(Ecran.Importation.route) { EcranTemporaire("Importation de fichiers") }
                      composable(Ecran.Historique.route) { EcranTemporaire("Historique des connexions") }
                      composable(Ecran.Parametres.route) { EcranParametres(nav) }
                      composable(Ecran.ConfigPerso.route) { EcranTemporaire("Configuration personnalisée") }
                      composable(Ecran.Abonnement.route) { EcranTemporaire("Abonnement") }
                      composable(Ecran.APropos.route) { EcranTemporaire("À propos de LORD VPN") }
                  }
              }
          }

          @Composable
          fun EcranTemporaire(titre: String) {
              Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                  Text(titre, style = MaterialTheme.typography.headlineSmall)
              }
          }

          @Composable
          fun EcranParametres(nav: NavHostController) {
              Column(
                  Modifier.fillMaxSize().padding(24.dp),
                  verticalArrangement = Arrangement.spacedBy(12.dp)
              ) {
                  Text("Paramètres", style = MaterialTheme.typography.headlineSmall)
                  listOf(Ecran.ConfigPerso, Ecran.Abonnement, Ecran.APropos).forEach { e ->
                      Button(onClick = { nav.navigate(e.route) }, modifier = Modifier.fillMaxWidth()) {
                          Text(e.titre)
                      }
                  }
              }
          }
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/java/com/lordvpn/ui/theme/Color.kt')"
          cat > 'app/src/main/java/com/lordvpn/ui/theme/Color.kt' <<'LORDEOF'
          package com.lordvpn.ui.theme

          import androidx.compose.ui.graphics.Color

          val Noir = Color(0xFF05070D)
          val BleuNuit = Color(0xFF0B1426)
          val BleuNuitClair = Color(0xFF14223F)
          val BleuElectrique = Color(0xFF1E90FF)
          val TexteClair = Color(0xFFEAF1FF)
          val TexteSecondaire = Color(0xFF8FA3C7)
          val Vert = Color(0xFF2ECC71)
          val Rouge = Color(0xFFE74C3C)
          val Orange = Color(0xFFF39C12)
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/java/com/lordvpn/ui/theme/Theme.kt')"
          cat > 'app/src/main/java/com/lordvpn/ui/theme/Theme.kt' <<'LORDEOF'
          package com.lordvpn.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable

          private val SchemaSombre = darkColorScheme(
              primary = BleuElectrique,
              onPrimary = Noir,
              background = Noir,
              onBackground = TexteClair,
              surface = BleuNuit,
              onSurface = TexteClair,
              surfaceVariant = BleuNuitClair,
              onSurfaceVariant = TexteSecondaire,
              error = Rouge
          )

          @Composable
          fun LordVpnTheme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = SchemaSombre, typography = Typography, content = content)
          }
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/java/com/lordvpn/ui/theme/Type.kt')"
          cat > 'app/src/main/java/com/lordvpn/ui/theme/Type.kt' <<'LORDEOF'
          package com.lordvpn.ui.theme

          import androidx.compose.material3.Typography

          val Typography = Typography()
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/java/com/lordvpn/vpn/VpnState.kt')"
          cat > 'app/src/main/java/com/lordvpn/vpn/VpnState.kt' <<'LORDEOF'
          package com.lordvpn.vpn

          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow

          enum class Statut { DECONNECTE, CONNEXION, CONNECTE }

          /** État réel du VPN. Sera piloté par LordVpnService (étape 2). */
          object VpnState {
              private val _statut = MutableStateFlow(Statut.DECONNECTE)
              val statut: StateFlow<Statut> = _statut

              /** Nom du serveur sélectionné (null = aucun). Rempli à l étape 4. */
              private val _serveur = MutableStateFlow<String?>(null)
              val serveur: StateFlow<String?> = _serveur

              fun definirStatut(s: Statut) { _statut.value = s }
          }
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/res/drawable/ic_launcher_foreground.xml')"
          cat > 'app/src/main/res/drawable/ic_launcher_foreground.xml' <<'LORDEOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp" android:height="108dp"
              android:viewportWidth="108" android:viewportHeight="108">
              <path android:fillColor="#1E90FF"
                  android:pathData="M54,24 L78,33 L78,54 C78,68 68,78 54,84 C40,78 30,68 30,54 L30,33 Z"/>
              <path android:fillColor="#05070D"
                  android:pathData="M49,50 L59,50 L59,62 L49,62 Z"/>
              <path android:strokeColor="#05070D" android:strokeWidth="3" android:fillColor="#00000000"
                  android:pathData="M51,50 L51,46 C51,41 57,41 57,46 L57,50"/>
          </vector>
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml')"
          cat > 'app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'LORDEOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/res/values/ic_launcher_background.xml')"
          cat > 'app/src/main/res/values/ic_launcher_background.xml' <<'LORDEOF'
          <resources>
              <color name="ic_launcher_background">#05070D</color>
          </resources>
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/res/values/strings.xml')"
          cat > 'app/src/main/res/values/strings.xml' <<'LORDEOF'
          <resources>
              <string name="app_name">LORD VPN</string>
          </resources>
          LORDEOF
          mkdir -p "$(dirname 'app/src/main/res/values/themes.xml')"
          cat > 'app/src/main/res/values/themes.xml' <<'LORDEOF'
          <resources>
              <style name="Theme.LordVpn" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">#05070D</item>
                  <item name="android:statusBarColor">@android:color/transparent</item>
                  <item name="android:navigationBarColor">@android:color/transparent</item>
              </style>
          </resources>
          LORDEOF
          mkdir -p "$(dirname 'build.gradle.kts')"
          cat > 'build.gradle.kts' <<'LORDEOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          LORDEOF
          mkdir -p "$(dirname 'gradle.properties')"
          cat > 'gradle.properties' <<'LORDEOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          android.nonTransitiveRClass=true
          LORDEOF
          mkdir -p "$(dirname 'settings.gradle.kts')"
          cat > 'settings.gradle.kts' <<'LORDEOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "LORD VPN"
          include(":app")
          LORDEOF
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Compiler l'APK
        working-directory: proj
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LORD-VPN-debug-apk
          path: proj/app/build/outputs/apk/debug/*.apk
